services:
  # ----------------------------------------
  # 1. DATABASE (PostgreSQL)
  # ----------------------------------------
  db:
    image: postgres:15-alpine
    container_name: areena-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:${DB_PORT:-5432}"
    volumes:
      - areena_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 5

  # ----------------------------------------
  # 2. CACHE & PUB/SUB (Redis)
  # ----------------------------------------
  redis:
    image: redis:7-alpine
    container_name: areena-redis
    restart: always
    ports:
      - "6379:6379"

  # ----------------------------------------
  # 3. LOCAL FILE STORAGE (MinIO S3 Emulator)
  # ----------------------------------------
  s3:
    image: minio/minio:latest
    container_name: areena-minio
    restart: always
    ports:
      - "9000:9000" # S3 API Port
      - "9001:9001" # Web Dashboard
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS}
    command: server /data --console-address ":9001"
    volumes:
      - areena_s3_data:/data

  # ----------------------------------------
  # 4. EXPRESS API BACKEND
  # ----------------------------------------
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: areena-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-4000}:${BACKEND_PORT:-4000}"
    environment:
      - NODE_ENV=development
      - BACKEND_PORT=${BACKEND_PORT:-4000}
      - DOMAIN_NAME=${DOMAIN_NAME}
      - APP_BASE_URL=${APP_BASE_URL}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASS}@${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME}?schema=public
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://s3:9000
      - S3_REGION=${MINIO_REGION}
      - S3_ACCESS_KEY_ID=${MINIO_USER}
      - S3_SECRET_ACCESS_KEY=${MINIO_PASS}
      - S3_BUCKET_NAME=${MINIO_BUCKET_NAME}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      s3:
        condition: service_started

  # ----------------------------------------
  # 5. WEBSOCKET SERVER
  # ----------------------------------------
  websocket:
    build:
      context: .
      dockerfile: apps/websocket-server/Dockerfile
    container_name: areena-websocket
    restart: unless-stopped
    ports:
      - "${WS_PORT:-5000}:${WS_PORT:-5000}"
    environment:
      - REDIS_URL=redis://redis:6379
      - WS_PORT=${WS_PORT:-5000}
    depends_on:
      - redis

  # ----------------------------------------
  # 6. FRONTEND (Next.js)
  # ----------------------------------------
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_WS_PORT: ${WS_PORT}
        NEXT_PUBLIC_IS_DEMO: ${IS_DEMO:-false}
        NEXT_PUBLIC_APP_BASE_URL: ${APP_BASE_URL}
    container_name: areena-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    environment:
      - NODE_ENV=development
      - BACKEND_INTERNAL_URL=http://backend:${BACKEND_PORT:-4000}
      - DOMAIN_NAME=${DOMAIN_NAME}
      - FRONTEND_PORT=${FRONTEND_PORT:-3000}
    depends_on:
      - backend
      - websocket

  # ----------------------------------------
  # 7. CENTRAL LOG SHIPPER (Vector - ~15MB RAM)
  # ----------------------------------------
  vector:
    image: timberio/vector:0.38.0-alpine
    restart: unless-stopped
    entrypoint: ["sh", "-c", "if [ -z \"$$LOGGING_URL\" ]; then echo 'LOGGING_URL is not set. Log shipping inactive.'; sleep infinity; else exec /usr/local/bin/vector --config /etc/vector/vector.toml; fi"]
    environment:
      - LOGGING_URL=${LOGGING_URL}
      - LOGGING_USER=${LOGGING_USER}
      - LOGGING_PASSWORD=${LOGGING_PASSWORD}
      - SERVER_NAME=${SERVER_NAME:-${DOMAIN_NAME:-areena-server}}
      - NODE_ENV=production
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./vector.toml:/etc/vector/vector.toml:ro

# ----------------------------------------
# PERSISTENT VOLUMES
# ----------------------------------------
volumes:
  areena_pg_data:
  areena_s3_data: