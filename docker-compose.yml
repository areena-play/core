services:
  # ----------------------------------------
  # 1. DATABASE (PostgreSQL)
  # ----------------------------------------
  db:
    image: postgres:15-alpine
    container_name: areena-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-areena_admin}
      POSTGRES_PASSWORD: ${DB_PASS:-supersecretpassword}
      POSTGRES_DB: ${DB_NAME:-areena_db}
    ports:
      - "5432:5432"
    volumes:
      - areena_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-areena_admin} -d ${DB_NAME:-areena_db}"]
      interval: 3s
      timeout: 3s
      retries: 5

  # ----------------------------------------
  # 2. CACHE & PUB/SUB (Redis)
  # ----------------------------------------
  redis:
    image: redis:7-alpine
    container_name: areena-redis
    restart: always
    ports:
      - "6379:6379"

  # ----------------------------------------
  # 3. LOCAL FILE STORAGE (MinIO S3 Emulator)
  # ----------------------------------------
  s3:
    image: minio/minio:latest
    container_name: areena-minio
    restart: always
    ports:
      - "9000:9000" # S3 API Port
      - "9001:9001" # Web Dashboard
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - areena_s3_data:/data

  # ----------------------------------------
  # 4. EXPRESS API BACKEND
  # ----------------------------------------
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: areena-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-areena_admin}:${DB_PASS:-supersecretpassword}@db:5432/${DB_NAME:-areena_db}?schema=public
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://s3:9000
      - AWS_REGION=${MINIO_REGION:-eu-central-2}
      - AWS_ACCESS_KEY_ID=${MINIO_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_PASS:-minioadmin}
      - AWS_BUCKET_NAME=${MINIO_BUCKET_NAME:-areena-local-storage}
      - PORT=4000
      - BACKEND_PORT=4000
      - JWT_SECRET=areena_jwt_secret_dev_key_2026
      - INTERNAL_API_SECRET=areena_internal_secret_key_2026
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      s3:
        condition: service_started

  # ----------------------------------------
  # 5. WEBSOCKET SERVER
  # ----------------------------------------
  websocket:
    build:
      context: .
      dockerfile: apps/websocket-server/Dockerfile
    container_name: areena-websocket
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=5000
    depends_on:
      - redis

  # ----------------------------------------
  # 6. FRONTEND (Next.js)
  # ----------------------------------------
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_WS_URL: ws://localhost:5000
    container_name: areena-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_WS_URL=ws://localhost:5000
      - BACKEND_INTERNAL_URL=http://backend:4000
      - INTERNAL_API_SECRET=areena_internal_secret_key_2026
    depends_on:
      - backend
      - websocket

  # ----------------------------------------
  # 7. CENTRAL LOG SHIPPER (Vector - ~15MB RAM)
  # ----------------------------------------
  vector:
    image: timberio/vector:0.38.0-alpine
    restart: unless-stopped
    entrypoint: ["sh", "-c", "if [ -z \"$$LOGGING_URL\" ]; then echo 'LOGGING_URL is not set. Log shipping inactive.'; sleep infinity; else exec /usr/local/bin/vector --config /etc/vector/vector.toml; fi"]
    environment:
      - LOGGING_URL=${LOGGING_URL:-}
      - LOGGING_USER=${LOGGING_USER:-shipper}
      - LOGGING_PASSWORD=${LOGGING_PASSWORD:-}
      - SERVER_NAME=${SERVER_NAME:-${DOMAIN_NAME:-areena-server}}
      - NODE_ENV=production
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./vector.toml:/etc/vector/vector.toml:ro

# ----------------------------------------
# PERSISTENT VOLUMES
# ----------------------------------------
volumes:
  areena_pg_data:
  areena_s3_data: