<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Red glowing gradient for ball -->
    <radialGradient id="redBallGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF5A45"/>
      <stop offset="60%" stop-color="#E23828"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </radialGradient>
    
    <!-- Arena Stadium Lighting -->
    <linearGradient id="stadiumDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Filter for subtle drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Stadium Arena Background Badge (Rounded Shield / Squircle) -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#stadiumDark)" stroke="#334155" stroke-width="8" filter="url(#shadow)"/>

  <!-- Arena Court Lines / Center Arena Ring -->
  <circle cx="256" cy="256" r="160" stroke="#334155" stroke-width="4" stroke-dasharray="8 8" opacity="0.4"/>

  <!-- LEFT 'E' (Facing Right towards center arena) -->
  <path d="
    M 175 140 
    C 115 140, 85 180, 85 256 
    C 85 332, 115 372, 175 372 
    L 205 372 
    L 205 328 
    L 165 328 
    C 135 328, 125 305, 125 256 
    C 125 207, 135 184, 165 184 
    L 205 184 
    L 205 140 
    Z
  " fill="#FFFFFF"/>
  
  <!-- Left E Middle Bar -->
  <rect x="125" y="236" width="70" height="40" rx="4" fill="#FFFFFF"/>

  <!-- RIGHT 'E' (Mirrored Ǝ - Facing Left towards center arena) -->
  <path d="
    M 337 140 
    C 397 140, 427 180, 427 256 
    C 427 332, 397 372, 337 372 
    L 307 372 
    L 307 328 
    L 347 328 
    C 377 328, 387 305, 387 256 
    C 387 207, 377 184, 347 184 
    L 307 184 
    L 307 140 
    Z
  " fill="#FFFFFF"/>

  <!-- Right E Middle Bar -->
  <rect x="317" y="236" width="70" height="40" rx="4" fill="#FFFFFF"/>

  <!-- CENTER AREENA RED BALL (The core of the Arena) -->
  <circle cx="256" cy="256" r="42" fill="url(#redBallGrad)" filter="url(#shadow)"/>
  
  <!-- Ball Highlight / Specular Reflection -->
  <ellipse cx="242" cy="242" rx="12" ry="7" transform="rotate(-30 242 242)" fill="#FFFFFF" opacity="0.6"/>
</svg>