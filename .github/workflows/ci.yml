name: CI Quality Checks

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  typecheck:
    name: Fast TypeScript & Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Build & Typecheck
        run: npm run build

