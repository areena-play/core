name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production_deploy
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # 1. BUILD ALL DOCKER IMAGES IN PARALLEL ON GITHUB ACTIONS
  # -------------------------------------------------------------
  build-and-push:
    name: Build Image (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        target:
          - name: "backend"
            image: "areena-backend"
            dockerfile: "apps/backend/Dockerfile"
            build_args: ""
          - name: "websocket"
            image: "areena-websocket"
            dockerfile: "apps/websocket-server/Dockerfile"
            build_args: ""
          - name: "frontend"
            image: "areena-frontend"
            dockerfile: "apps/frontend/Dockerfile"
            build_args: ""

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Registry Variables
        id: prep
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER_LC=${OWNER_LC}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push ${{ matrix.target.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.target.dockerfile }}
          build-args: ${{ matrix.target.build_args }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.target.image }}:latest
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.target.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.name }}

  # -------------------------------------------------------------
  # 2. ZERO-DOWNTIME MULTI-INSTANCE DEPLOYMENT VIA SSH
  # -------------------------------------------------------------
  deploy-live:
    name: Deploy (${{ matrix.server.name }})
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        server:
          # =============================================================
          # 1. PRIMARY PRODUCTION INSTANCE
          # (Uses PROD_* variables/secrets by default)
          # =============================================================
          - name: "Production Primary"
            project_name: "areena-prod"
            prefix: "PROD"
            host_key: "PROD_SSH_HOST"
            user_key: "PROD_SSH_USER"
            key_secret: "PROD_SSH_KEY"
            port_key: "PROD_SSH_PORT"
            path_key: "PROD_DEPLOY_PATH"

          # =============================================================
          # 2. HOW TO ADD ADDITIONAL INSTANCES:
          #
          # SCENARIO A: Multiple instances of the SAME APP (same domain / cluster nodes)
          # - name: "Production Secondary Node"
          #   project_name: "areena-prod-node2"
          #   prefix: "PROD"
          #   host_key: "PROD_NODE2_SSH_HOST"
          #   user_key: "PROD_SSH_USER"
          #   key_secret: "PROD_SSH_KEY"
          #
          # SCENARIO B: Completely SEPARATE INSTANCES (different domain & database)
          # (Define STTF_DOMAIN, STTF_DATABASE_URL, STTF_SSH_HOST, etc. in GitHub Secrets/Vars)
          # - name: "Swiss Table Tennis Federation"
          #   project_name: "areena-sttf"
          #   prefix: "STTF"
          #   host_key: "STTF_SSH_HOST"
          #   user_key: "STTF_SSH_USER"
          #   key_secret: "STTF_SSH_KEY"
          # =============================================================

    steps:
      - name: Set lower case owner name
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY_IMAGE_PREFIX=ghcr.io/${OWNER_LC}/" >> $GITHUB_ENV

      - name: Trigger Fast Image Pull & Restart via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          USE_PREBUILT_IMAGES: "true"
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
          REGISTRY_IMAGE_PREFIX: ${{ env.REGISTRY_IMAGE_PREFIX }}
          IMAGE_TAG: "latest"

          # Core Domain, Ports & SSL
          FRONTEND_PORT: ${{ vars[format('{0}_FRONTEND_PORT', matrix.server.prefix)] || vars.PROD_FRONTEND_PORT }}
          BACKEND_PORT: ${{ vars[format('{0}_BACKEND_PORT', matrix.server.prefix)] || vars.PROD_BACKEND_PORT }}
          WS_PORT: ${{ vars[format('{0}_WS_PORT', matrix.server.prefix)] || vars.PROD_WS_PORT }}
          APP_BASE_URL: ${{ vars[format('{0}_APP_BASE_URL', matrix.server.prefix)] || vars.PROD_APP_BASE_URL }}
          DOMAIN_NAME: ${{ vars[format('{0}_DOMAIN', matrix.server.prefix)] || vars[format('{0}_DOMAIN_NAME', matrix.server.prefix)] || vars.PROD_DOMAIN || vars.PROD_DOMAIN_NAME }}
          LETSENCRYPT_EMAIL: ${{ vars[format('{0}_LETSENCRYPT_EMAIL', matrix.server.prefix)] || vars.LETSENCRYPT_EMAIL }}
          SERVER_NAME: ${{ matrix.server.name || vars[format('{0}_SERVER_NAME', matrix.server.prefix)] || vars.PROD_SERVER_NAME || 'areena-production' }}
          AREENA_SUPPORT_EMAIL: ${{ vars[format('{0}_AREENA_SUPPORT_EMAIL', matrix.server.prefix)] || vars.PROD_AREENA_SUPPORT_EMAIL || vars.AREENA_SUPPORT_EMAIL }}
          BACKEND_INTERNAL_URL: ${{ vars[format('{0}_BACKEND_INTERNAL_URL', matrix.server.prefix)] || vars.PROD_BACKEND_INTERNAL_URL }}
          IS_DEMO: ${{ vars[format('{0}_IS_DEMO', matrix.server.prefix)] || vars.PROD_IS_DEMO || 'false' }}

          # Database & Security
          DATABASE_URL: ${{ secrets[format('{0}_DATABASE_URL', matrix.server.prefix)] || secrets.PROD_DATABASE_URL }}
          JWT_SECRET: ${{ secrets[format('{0}_JWT_SECRET', matrix.server.prefix)] || secrets.PROD_JWT_SECRET }}
          REDIS_URL: ${{ vars[format('{0}_REDIS_URL', matrix.server.prefix)] || vars.PROD_REDIS_URL || '' }}

          # Storage (S3 / MinIO)
          AWS_ENDPOINT: ${{ vars[format('{0}_AWS_ENDPOINT', matrix.server.prefix)] || vars[format('{0}_S3_ENDPOINT', matrix.server.prefix)] || vars.PROD_AWS_ENDPOINT || vars.PROD_S3_ENDPOINT || '' }}
          AWS_REGION: ${{ vars[format('{0}_AWS_REGION', matrix.server.prefix)] || vars.PROD_AWS_REGION || vars.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets[format('{0}_AWS_ACCESS_KEY_ID', matrix.server.prefix)] || secrets.PROD_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets[format('{0}_AWS_SECRET_ACCESS_KEY', matrix.server.prefix)] || secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          AWS_BUCKET_NAME: ${{ vars[format('{0}_AWS_BUCKET_NAME', matrix.server.prefix)] || vars.PROD_AWS_BUCKET_NAME }}

          # Web Push (VAPID)
          VAPID_PUBLIC_KEY: ${{ vars[format('{0}_VAPID_PUBLIC_KEY', matrix.server.prefix)] || vars.PROD_VAPID_PUBLIC_KEY || '' }}
          VAPID_PRIVATE_KEY: ${{ secrets[format('{0}_VAPID_PRIVATE_KEY', matrix.server.prefix)] || secrets.PROD_VAPID_PRIVATE_KEY || '' }}
          VAPID_SUBJECT: ${{ vars[format('{0}_VAPID_SUBJECT', matrix.server.prefix)] || vars.PROD_VAPID_SUBJECT || vars.VAPID_SUBJECT }}

          # Central Monitoring (Vector / Loki)
          LOGGING_URL: ${{ vars[format('{0}_LOGGING_URL', matrix.server.prefix)] || vars.LOGGING_URL }}
          LOGGING_USER: ${{ vars[format('{0}_LOGGING_USER', matrix.server.prefix)] || vars.LOGGING_USER }}
          LOGGING_PASSWORD: ${{ secrets[format('{0}_LOGGING_PASSWORD', matrix.server.prefix)] || secrets.LOGGING_PASSWORD }}

        with:
          host: ${{ vars[matrix.server.host_key] || secrets[matrix.server.host_key] }}
          username: ${{ vars[matrix.server.user_key] || secrets[matrix.server.user_key] }}
          key: ${{ secrets[matrix.server.key_secret] }}
          port: ${{ (matrix.server.port_key && (vars[matrix.server.port_key] || secrets[matrix.server.port_key])) || 22 }}
          envs: USE_PREBUILT_IMAGES,GHCR_USER,GHCR_TOKEN,REGISTRY_IMAGE_PREFIX,IMAGE_TAG,FRONTEND_PORT,BACKEND_PORT,WS_PORT,APP_BASE_URL,DOMAIN_NAME,LETSENCRYPT_EMAIL,SERVER_NAME,AREENA_SUPPORT_EMAIL,BACKEND_INTERNAL_URL,IS_DEMO,DATABASE_URL,JWT_SECRET,REDIS_URL,AWS_ENDPOINT,AWS_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_BUCKET_NAME,VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY,VAPID_SUBJECT,LOGGING_URL,LOGGING_USER,LOGGING_PASSWORD
          script_stop: true
          script: |
            # Resolve deploy path, default to ~/areena
            RAW_PATH="${{ (matrix.server.path_key && (vars[matrix.server.path_key] || secrets[matrix.server.path_key])) || '~/areena' }}"
            TARGET_PATH="${RAW_PATH/#\~/$HOME}"
            echo "🚀 Connecting to ${{ matrix.server.name }} at $TARGET_PATH..."
            
            # Ensure target directory exists and repo is initialized
            if [ ! -d "$TARGET_PATH/.git" ]; then
              echo "📥 Repository not found at $TARGET_PATH. Initializing and cloning..."
              mkdir -p "$TARGET_PATH"
              git clone "https://github.com/${{ github.repository }}.git" "$TARGET_PATH"
            fi
            
            cd "$TARGET_PATH"
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh main "${{ matrix.server.project_name }}"
