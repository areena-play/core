name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production_deploy
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # 1. BUILD ALL DOCKER IMAGES IN PARALLEL ON GITHUB ACTIONS
  # -------------------------------------------------------------
  build-and-push:
    name: Build Image (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        target:
          - name: "backend"
            image: "areena-backend"
            dockerfile: "apps/backend/Dockerfile"
            build_args: ""
          - name: "websocket"
            image: "areena-websocket"
            dockerfile: "apps/websocket-server/Dockerfile"
            build_args: ""
          - name: "frontend"
            image: "areena-frontend"
            dockerfile: "apps/frontend/Dockerfile"
            build_args: "NEXT_PUBLIC_API_URL=/api"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Registry Variables
        id: prep
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER_LC=${OWNER_LC}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push ${{ matrix.target.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.target.dockerfile }}
          build-args: ${{ matrix.target.build_args }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.target.image }}:latest
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.target.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.name }}

  # -------------------------------------------------------------
  # 2. ZERO-DOWNTIME DEPLOYMENT ON LIVE / DEMO VPS
  # -------------------------------------------------------------
  deploy-live:
    name: Deploy to Live Server (${{ matrix.server.name }})
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        server:
          # -------------------------------------------------------------
          # 1. Current Live / Demo Instance
          # -------------------------------------------------------------
          - name: "Demo Server"
            project_name: "areena-demo"
            host_key: "PROD_SSH_HOST"
            user_key: "PROD_SSH_USER"
            key_secret: "PROD_SSH_KEY"
            domain_key: "PROD_DOMAIN"      # Optional (e.g. demo.areena.ch)
            port_key: "PROD_SSH_PORT"      # Optional (defaults to 22)
            path_key: "PROD_DEPLOY_PATH"   # Optional (defaults to ~/areena)
            env_secret: "PROD_ENV"

          # -------------------------------------------------------------
          # 2. How to Add Future Productive Live Instances:
          # Simply uncomment and fill in the corresponding GitHub Variable/Secret names:
          # -------------------------------------------------------------
          # - name: "Live Production Server 1"
          #   project_name: "areena-prod-1"
          #   host_key: "PROD1_SSH_HOST"
          #   user_key: "PROD1_SSH_USER"
          #   key_secret: "PROD1_SSH_KEY"
          #   domain_key: "PROD1_DOMAIN"     # Optional
          #   port_key: "PROD1_SSH_PORT"     # Optional
          #   path_key: "PROD1_DEPLOY_PATH"  # Optional (defaults to ~/areena)
          #   env_secret: "PROD1_ENV"

    steps:
      - name: Set lower case owner name
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY_IMAGE_PREFIX=ghcr.io/${OWNER_LC}/" >> $GITHUB_ENV

      - name: Trigger Fast Image Pull & Restart via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_ENV_CONTENT: ${{ secrets[matrix.server.env_secret] || secrets.PROD_ENV }}
          USE_PREBUILT_IMAGES: "true"
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
          REGISTRY_IMAGE_PREFIX: ${{ env.REGISTRY_IMAGE_PREFIX }}
          DOMAIN_NAME: ${{ (matrix.server.domain_key && vars[matrix.server.domain_key]) || 'localhost' }}
          LETSENCRYPT_EMAIL: ${{ vars.LETSENCRYPT_EMAIL }}
          LOGGING_URL: ${{ vars.LOGGING_URL || vars.LOKI_URL || '' }}
          LOGGING_USER: ${{ vars.LOGGING_USER || 'shipper' }}
          LOGGING_PASSWORD: ${{ secrets.LOGGING_PASSWORD || '' }}
          SERVER_NAME: ${{ matrix.server.name || 'areena-production' }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY || '' }}
          MAILGUN_DOMAIN: ${{ vars.MAILGUN_DOMAIN || '' }}
          MAILGUN_EU: ${{ vars.MAILGUN_EU || 'false' }}
          MAILGUN_HOST: ${{ vars.MAILGUN_HOST || '' }}
          SMTP_HOST: ${{ vars.SMTP_HOST || '' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USER: ${{ vars.SMTP_USER || secrets.SMTP_USER || '' }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || secrets.SMTP_PASSWORD || '' }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE || 'false' }}
          AREENA_SUPPORT_EMAIL: ${{ vars.AREENA_SUPPORT_EMAIL || 'support@areena.ch' }}
        with:
          host: ${{ vars[matrix.server.host_key] || secrets[matrix.server.host_key] }}
          username: ${{ vars[matrix.server.user_key] || secrets[matrix.server.user_key] }}
          key: ${{ secrets[matrix.server.key_secret] }}
          port: ${{ vars[matrix.server.port_key] || secrets[matrix.server.port_key] || 22 }}
          envs: APP_ENV_CONTENT,USE_PREBUILT_IMAGES,GHCR_USER,GHCR_TOKEN,REGISTRY_IMAGE_PREFIX,DOMAIN_NAME,LETSENCRYPT_EMAIL,LOGGING_URL,LOGGING_USER,LOGGING_PASSWORD,SERVER_NAME,AREENA_SUPPORT_EMAIL
          script_stop: true
          script: |
            # Resolve deploy path, default to ~/areena
            RAW_PATH="${{ (matrix.server.path_key && (vars[matrix.server.path_key] || secrets[matrix.server.path_key])) || '~/areena' }}"
            TARGET_PATH="${RAW_PATH/#\~/$HOME}"
            echo "🚀 Connecting to ${{ matrix.server.name }} at $TARGET_PATH..."
            
            # Ensure target directory exists and repo is initialized
            if [ ! -d "$TARGET_PATH/.git" ]; then
              echo "📥 Repository not found at $TARGET_PATH. Initializing and cloning..."
              mkdir -p "$TARGET_PATH"
              git clone "https://github.com/${{ github.repository }}.git" "$TARGET_PATH"
            fi
            
            cd "$TARGET_PATH"
            
            # Export registry image prefix to .env if not present
            if ! grep -q "REGISTRY_IMAGE_PREFIX" .env 2>/dev/null; then
              echo "REGISTRY_IMAGE_PREFIX=$REGISTRY_IMAGE_PREFIX" >> .env
            fi
            
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh main "${{ matrix.server.project_name }}"
