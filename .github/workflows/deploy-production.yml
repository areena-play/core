name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production_deploy
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # 1. BUILD ALL DOCKER IMAGES IN PARALLEL ON GITHUB ACTIONS
  # -------------------------------------------------------------
  build-and-push:
    name: Build Image (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        target:
          - name: "backend"
            image: "areena-backend"
            dockerfile: "apps/backend/Dockerfile"
            build_args: ""
          - name: "websocket"
            image: "areena-websocket"
            dockerfile: "apps/websocket-server/Dockerfile"
            build_args: ""
          - name: "frontend"
            image: "areena-frontend"
            dockerfile: "apps/frontend/Dockerfile"
            build_args: ""

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Registry Variables
        id: prep
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER_LC=${OWNER_LC}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push ${{ matrix.target.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.target.dockerfile }}
          build-args: ${{ matrix.target.build_args }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.target.image }}:latest
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.target.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.name }}

  # -------------------------------------------------------------
  # 2. ZERO-DOWNTIME DEPLOYMENT ON LIVE / DEMO VPS
  # -------------------------------------------------------------
  deploy-live:
    name: Deploy to Live Server (${{ matrix.server.name }})
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        server:
          # -------------------------------------------------------------
          # 1. Current Live / Demo Instance
          # -------------------------------------------------------------
          - name: "Demo Server"
            project_name: "areena-demo"
            host_key: "PROD_SSH_HOST"
            user_key: "PROD_SSH_USER"
            key_secret: "PROD_SSH_KEY"
            domain_key: "PROD_DOMAIN"      # Optional (e.g. demo.areena.ch)
            port_key: "PROD_SSH_PORT"      # Optional (defaults to 22)
            path_key: "PROD_DEPLOY_PATH"   # Optional (defaults to ~/areena)

          # -------------------------------------------------------------
          # 2. How to Add Future Productive Live Instances:
          # Simply uncomment and fill in the corresponding GitHub Variable/Secret names:
          # -------------------------------------------------------------
          # - name: "Live Production Server 1"
          #   project_name: "areena-prod-1"
          #   host_key: "PROD1_SSH_HOST"
          #   user_key: "PROD1_SSH_USER"
          #   key_secret: "PROD1_SSH_KEY"
          #   domain_key: "PROD1_DOMAIN"     # Optional
          #   port_key: "PROD1_SSH_PORT"     # Optional
          #   path_key: "PROD1_DEPLOY_PATH"  # Optional (defaults to ~/areena)

    steps:
      - name: Set lower case owner name
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY_IMAGE_PREFIX=ghcr.io/${OWNER_LC}/" >> $GITHUB_ENV

      - name: Trigger Fast Image Pull & Restart via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          USE_PREBUILT_IMAGES: "true"
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
          REGISTRY_IMAGE_PREFIX: ${{ env.REGISTRY_IMAGE_PREFIX }}
          IMAGE_TAG: "latest"
          # Core Domain & SSL
          DOMAIN_NAME: ${{ (matrix.server.domain_key && vars[matrix.server.domain_key]) || vars.PROD_DOMAIN || vars.DOMAIN_NAME || 'localhost' }}
          LETSENCRYPT_EMAIL: ${{ vars.LETSENCRYPT_EMAIL }}
          SERVER_NAME: ${{ matrix.server.name || vars.PROD_SERVER_NAME || 'areena-production' }}
          AREENA_SUPPORT_EMAIL: ${{ vars.PROD_AREENA_SUPPORT_EMAIL || vars.AREENA_SUPPORT_EMAIL || 'support@areena.ch' }}
          IS_DEMO: ${{ vars.PROD_IS_DEMO || vars.IS_DEMO || 'false' }}
          # Database & Security
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL || secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.PROD_JWT_SECRET || secrets.JWT_SECRET }}
          REDIS_URL: ${{ vars.PROD_REDIS_URL || vars.REDIS_URL || secrets.PROD_REDIS_URL || secrets.REDIS_URL || '' }}
          # Storage (S3)
          S3_ENDPOINT: ${{ vars.PROD_S3_ENDPOINT || vars.S3_ENDPOINT || '' }}
          AWS_REGION: ${{ vars.PROD_AWS_REGION || vars.AWS_REGION || 'eu-central-2' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PROD_AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_BUCKET_NAME: ${{ vars.PROD_AWS_BUCKET_NAME || vars.AWS_BUCKET_NAME || secrets.PROD_AWS_BUCKET_NAME || secrets.AWS_BUCKET_NAME || '' }}
          # Web Push (VAPID)
          VAPID_PUBLIC_KEY: ${{ vars.PROD_VAPID_PUBLIC_KEY || vars.VAPID_PUBLIC_KEY || secrets.PROD_VAPID_PUBLIC_KEY || secrets.VAPID_PUBLIC_KEY || '' }}
          VAPID_PRIVATE_KEY: ${{ secrets.PROD_VAPID_PRIVATE_KEY || secrets.VAPID_PRIVATE_KEY || '' }}
          VAPID_SUBJECT: ${{ vars.PROD_VAPID_SUBJECT || vars.VAPID_SUBJECT || 'mailto:admin@areena.ch' }}
          # Central Monitoring (Vector / Loki)
          LOGGING_URL: ${{ vars.LOGGING_URL || vars.LOKI_URL || '' }}
          LOGGING_USER: ${{ vars.LOGGING_USER || 'shipper' }}
          LOGGING_PASSWORD: ${{ secrets.LOGGING_PASSWORD || '' }}
        with:
          host: ${{ vars[matrix.server.host_key] || secrets[matrix.server.host_key] }}
          username: ${{ vars[matrix.server.user_key] || secrets[matrix.server.user_key] }}
          key: ${{ secrets[matrix.server.key_secret] }}
          port: ${{ vars[matrix.server.port_key] || secrets[matrix.server.port_key] || 22 }}
          envs: USE_PREBUILT_IMAGES,GHCR_USER,GHCR_TOKEN,REGISTRY_IMAGE_PREFIX,IMAGE_TAG,DOMAIN_NAME,LETSENCRYPT_EMAIL,SERVER_NAME,AREENA_SUPPORT_EMAIL,IS_DEMO,DATABASE_URL,JWT_SECRET,REDIS_URL,S3_ENDPOINT,AWS_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_BUCKET_NAME,VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY,VAPID_SUBJECT,LOGGING_URL,LOGGING_USER,LOGGING_PASSWORD
          script_stop: true
          script: |
            # Resolve deploy path, default to ~/areena
            RAW_PATH="${{ (matrix.server.path_key && (vars[matrix.server.path_key] || secrets[matrix.server.path_key])) || '~/areena' }}"
            TARGET_PATH="${RAW_PATH/#\~/$HOME}"
            echo "🚀 Connecting to ${{ matrix.server.name }} at $TARGET_PATH..."
            
            # Ensure target directory exists and repo is initialized
            if [ ! -d "$TARGET_PATH/.git" ]; then
              echo "📥 Repository not found at $TARGET_PATH. Initializing and cloning..."
              mkdir -p "$TARGET_PATH"
              git clone "https://github.com/${{ github.repository }}.git" "$TARGET_PATH"
            fi
            
            cd "$TARGET_PATH"
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh main "${{ matrix.server.project_name }}"
