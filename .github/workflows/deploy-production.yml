name: Deploy Production (Build on GitHub & Deploy Pre-built Images)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production_deploy
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # 1. BUILD & VERIFY DOCKER IMAGES ON GITHUB ACTIONS
  # -------------------------------------------------------------
  build-and-push:
    name: Build & Verify Production Images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      registry_prefix: ${{ steps.prep.outputs.registry_prefix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Registry Variables
        id: prep
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER_LC=${OWNER_LC}" >> $GITHUB_ENV
          echo "registry_prefix=ghcr.io/${OWNER_LC}/" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- 1a. Build Backend ---
      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/areena-backend:latest
            ghcr.io/${{ env.OWNER_LC }}/areena-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- 1b. Build WebSocket ---
      - name: Build & Push WebSocket
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/websocket-server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/areena-websocket:latest
            ghcr.io/${{ env.OWNER_LC }}/areena-websocket:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- 1c. Build Frontend (Next.js) ---
      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/areena-frontend:latest
            ghcr.io/${{ env.OWNER_LC }}/areena-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # 2. ZERO-DOWNTIME DEPLOYMENT ON LIVE / DEMO VPS
  # -------------------------------------------------------------
  deploy-live:
    name: Deploy to Live Server (${{ matrix.server.name }})
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        server:
          - name: "Demo Server"
            project_name: "areena-demo"
            host_secret: "PROD_SSH_HOST"
            user_secret: "PROD_SSH_USER"
            key_secret: "PROD_SSH_KEY"
            port_secret: "PROD_SSH_PORT"
            path_secret: "PROD_DEPLOY_PATH"
            env_secret: "PROD_ENV"

    steps:
      - name: Trigger Fast Image Pull & Restart via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_ENV_CONTENT: ${{ secrets[matrix.server.env_secret] || secrets.PROD_ENV }}
          USE_PREBUILT_IMAGES: "true"
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
          REGISTRY_IMAGE_PREFIX: ${{ needs.build-and-push.outputs.registry_prefix }}
        with:
          host: ${{ secrets[matrix.server.host_secret] || secrets.SSH_HOST }}
          username: ${{ secrets[matrix.server.user_secret] || secrets.SSH_USER }}
          key: ${{ secrets[matrix.server.key_secret] || secrets.SSH_KEY }}
          port: ${{ secrets[matrix.server.port_secret] || secrets.SSH_PORT || 22 }}
          envs: APP_ENV_CONTENT,USE_PREBUILT_IMAGES,GHCR_USER,GHCR_TOKEN,REGISTRY_IMAGE_PREFIX
          script_stop: true
          script: |
            TARGET_PATH="${{ secrets[matrix.server.path_secret] || secrets.DEPLOY_PATH || '~/areena' }}"
            echo "🚀 Connecting to ${{ matrix.server.name }}..."
            cd "$TARGET_PATH"
            
            # Export registry image prefix to .env if not present
            if ! grep -q "REGISTRY_IMAGE_PREFIX" .env 2>/dev/null; then
              echo "REGISTRY_IMAGE_PREFIX=$REGISTRY_IMAGE_PREFIX" >> .env
            fi
            
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh main "${{ matrix.server.project_name }}"
