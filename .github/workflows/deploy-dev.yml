name: Deploy Development

on:
  push:
    branches:
      - dev/main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dev_deploy
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # 1. BUILD ALL DOCKER IMAGES IN PARALLEL ON GITHUB ACTIONS
  # -------------------------------------------------------------
  build-and-push:
    name: Build Dev Image (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        target:
          - name: "backend"
            image: "areena-backend"
            dockerfile: "apps/backend/Dockerfile"
            build_args: ""
          - name: "websocket"
            image: "areena-websocket"
            dockerfile: "apps/websocket-server/Dockerfile"
            build_args: ""
          - name: "frontend"
            image: "areena-frontend"
            dockerfile: "apps/frontend/Dockerfile"
            build_args: ""

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Registry Variables
        id: prep
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER_LC=${OWNER_LC}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Dev ${{ matrix.target.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.target.dockerfile }}
          build-args: ${{ matrix.target.build_args }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.target.image }}:dev-latest
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.target.image }}:dev-${{ github.sha }}
          cache-from: type=gha,scope=dev-${{ matrix.target.name }}
          cache-to: type=gha,mode=max,scope=dev-${{ matrix.target.name }}

  # -------------------------------------------------------------
  # 2. FAST PULL & RESTART ON DEV VPS (SELF-HOSTED)
  # -------------------------------------------------------------
  deploy-dev:
    name: Fast Deploy on Dev VPS
    needs: build-and-push
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set lower case owner name
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY_IMAGE_PREFIX=ghcr.io/${OWNER_LC}/" >> $GITHUB_ENV

      - name: Run Fast Deploy Script
        env:
          USE_PREBUILT_IMAGES: "true"
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
          REGISTRY_IMAGE_PREFIX: ${{ env.REGISTRY_IMAGE_PREFIX }}
          IMAGE_TAG: "dev-latest"
          # Core Domain & SSL
          FRONTEND_PORT: ${{ vars.DEV_FRONTEND_PORT }}
          BACKEND_PORT: ${{ vars.DEV_BACKEND_PORT }}
          WS_PORT: ${{ vars.DEV_WS_PORT }}
          APP_BASE_URL: ${{ vars.DEV_APP_BASE_URL }}
          DOMAIN_NAME: ${{ vars.DEV_DOMAIN }}
          LETSENCRYPT_EMAIL: ${{ vars.LETSENCRYPT_EMAIL }}
          SERVER_NAME: ${{ vars.DEV_SERVER_NAME || 'areena-dev' }}
          AREENA_SUPPORT_EMAIL: ${{ vars.DEV_AREENA_SUPPORT_EMAIL || vars.AREENA_SUPPORT_EMAIL }}
          BACKEND_INTERNAL_URL: ${{ vars.DEV_BACKEND_INTERNAL_URL }}
          IS_DEMO: ${{ vars.DEV_IS_DEMO || 'false' }}
          # Database & Security
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.DEV_JWT_SECRET }}
          REDIS_URL: ${{ vars.DEV_REDIS_URL || '' }}
          # Storage (S3)
          AWS_ENDPOINT: ${{ vars.DEV_AWS_ENDPOINT }}
          AWS_REGION: ${{ vars.DEV_AWS_REGION || vars.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          AWS_BUCKET_NAME: ${{ vars.DEV_AWS_BUCKET_NAME }}
          # Web Push (VAPID)
          VAPID_PUBLIC_KEY: ${{ vars.DEV_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.DEV_VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.DEV_VAPID_SUBJECT || vars.VAPID_SUBJECT }}
          # Central Monitoring (Vector / Loki)
          LOGGING_URL: ${{ vars.LOGGING_URL }}
          LOGGING_USER: ${{ vars.LOGGING_USER }}
          LOGGING_PASSWORD: ${{ secrets.LOGGING_PASSWORD }}
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh dev/main "areena-dev"
