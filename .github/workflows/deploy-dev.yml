name: Deploy Development (Dev Instance)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: dev_deploy
  cancel-in-progress: true

jobs:
  deploy-dev:
    name: Deploy to Dev Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger Remote Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_ENV_CONTENT: ${{ secrets.DEV_ENV }}
        with:
          host: ${{ vars.DEV_SSH_HOST || secrets.DEV_SSH_HOST }}
          username: ${{ vars.DEV_SSH_USER || secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: ${{ vars.DEV_SSH_PORT || secrets.DEV_SSH_PORT || 22 }}
          envs: APP_ENV_CONTENT
          script_stop: true
          script: |
            TARGET_PATH="${{ vars.DEV_DEPLOY_PATH || secrets.DEV_DEPLOY_PATH || '~/areena' }}"
            echo "🚀 Connecting to Dev Server at $TARGET_PATH..."
            cd "$TARGET_PATH"
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh dev "areena-dev"
