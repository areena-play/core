name: Deploy Development

on:
  push:
    branches:
      - dev/main
  workflow_dispatch:

concurrency:
  group: dev_deploy
  cancel-in-progress: true

jobs:
  deploy-dev:
    name: Deploy to Dev Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger Remote Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_ENV_CONTENT: ${{ secrets.DEV_ENV }}
        with:
          host: ${{ vars.DEV_SSH_HOST || secrets.DEV_SSH_HOST }}
          username: ${{ vars.DEV_SSH_USER || secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: ${{ vars.DEV_SSH_PORT || secrets.DEV_SSH_PORT || 22 }}
          envs: APP_ENV_CONTENT
          script_stop: true
          script: |
            # Resolve deploy path, default to ~/areena
            RAW_PATH="${{ vars.DEV_DEPLOY_PATH || secrets.DEV_DEPLOY_PATH || '~/areena' }}"
            TARGET_PATH="${RAW_PATH/#\~/$HOME}"
            echo "🚀 Connecting to Dev Server at $TARGET_PATH..."
            
            # Ensure target directory exists and repo is initialized
            if [ ! -d "$TARGET_PATH/.git" ]; then
              echo "📥 Repository not found at $TARGET_PATH. Initializing and cloning..."
              mkdir -p "$TARGET_PATH"
              git clone "https://github.com/${{ github.repository }}.git" "$TARGET_PATH"
            fi
            
            cd "$TARGET_PATH"
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh dev/main "areena-dev"
