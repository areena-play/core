# ==============================================================================
# AREENA PRODUCTION & DEV DEPLOYMENT COMPOSE
# (Uses External Database & External S3 Storage - No local DB / S3 containers)
# ==============================================================================

services:
  # ----------------------------------------
  # 1. CACHE & PUB/SUB (Redis)
  # ----------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # ----------------------------------------
  # 2. EXPRESS API BACKEND
  # ----------------------------------------
  backend:
    image: ${REGISTRY_IMAGE_PREFIX:-}areena-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      - PORT=4000
      - BACKEND_PORT=4000
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - AWS_REGION=${AWS_REGION:-eu-central-2}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
    depends_on:
      - redis

  # ----------------------------------------
  # 3. WEBSOCKET SERVER
  # ----------------------------------------
  websocket:
    image: ${REGISTRY_IMAGE_PREFIX:-}areena-websocket:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/websocket-server/Dockerfile
    restart: unless-stopped
    ports:
      - "${WS_PORT:-5000}:5000"
    environment:
      - PORT=5000
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      - redis

  # ----------------------------------------
  # 4. FRONTEND (Next.js App Router)
  # ----------------------------------------
  frontend:
    image: ${REGISTRY_IMAGE_PREFIX:-}areena-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:5000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:5000}
      - BACKEND_INTERNAL_URL=http://backend:4000
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
    depends_on:
      - backend
      - websocket
