# ==============================================================================
# AREENA PRODUCTION & DEV DEPLOYMENT COMPOSE
# (Uses External Database & External S3 Storage, Automated Let's Encrypt SSL)
# ==============================================================================

services:
  # ----------------------------------------
  # 1. REVERSE PROXY & AUTOMATED SSL (Caddy)
  # ----------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - websocket

  # ----------------------------------------
  # 2. CACHE & PUB/SUB (Redis)
  # ----------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # ----------------------------------------
  # 3. EXPRESS API BACKEND
  # ----------------------------------------
  backend:
    image: ${REGISTRY_IMAGE_PREFIX:-}areena-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=4000
      - BACKEND_PORT=4000
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - AWS_REGION=${AWS_REGION:-eu-central-2}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-${SMTP_PASSWORD:-}}
      - SMTP_SECURE=${SMTP_SECURE:-}
      - MAILGUN_API_KEY=${MAILGUN_API_KEY:-}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN:-}
      - MAILGUN_HOST=${MAILGUN_HOST:-}
      - MAILGUN_EU=${MAILGUN_EU:-false}
      - EMAIL_FROM_DEFAULT=${EMAIL_FROM_DEFAULT:-}
      - AREENA_SUPPORT_EMAIL=${AREENA_SUPPORT_EMAIL:-}
    depends_on:
      - redis

  # ----------------------------------------
  # 4. WEBSOCKET SERVER
  # ----------------------------------------
  websocket:
    image: ${REGISTRY_IMAGE_PREFIX:-}areena-websocket:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/websocket-server/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=5000
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      - redis

  # ----------------------------------------
  # 5. FRONTEND (Next.js App Router)
  # ----------------------------------------
  frontend:
    image: ${REGISTRY_IMAGE_PREFIX:-}areena-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - BACKEND_INTERNAL_URL=http://backend:4000
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
    depends_on:
      - backend
      - websocket

volumes:
  caddy_data:
  caddy_config:
