# ==============================================================================
# AREENA PRODUCTION & DEV DEPLOYMENT COMPOSE
# (Uses External Database & External S3 Storage, Automated Let's Encrypt SSL)
# ==============================================================================

services:
  # ----------------------------------------
  # 1. REVERSE PROXY & AUTOMATED SSL (Caddy)
  # ----------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - FRONTEND_PORT=${FRONTEND_PORT:-3000}
      - BACKEND_PORT=${BACKEND_PORT:-4000}
      - WS_PORT=${WS_PORT:-5000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - websocket

  # ----------------------------------------
  # 2. CACHE & PUB/SUB (Redis)
  # ----------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # ----------------------------------------
  # 3. EXPRESS API BACKEND
  # ----------------------------------------
  backend:
    image: ${REGISTRY_IMAGE_PREFIX:-}areena-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      - BACKEND_PORT=${BACKEND_PORT:-4000}
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - S3_ENDPOINT=${AWS_ENDPOINT}
      - S3_REGION=${AWS_REGION}
      - S3_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET_NAME=${AWS_BUCKET_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - AREENA_SUPPORT_EMAIL=${AREENA_SUPPORT_EMAIL}
      - DOMAIN_NAME=${DOMAIN_NAME}
      - APP_BASE_URL=${APP_BASE_URL}
      - IS_DEMO=${IS_DEMO:-false}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
    depends_on:
      - redis

  # ----------------------------------------
  # 4. WEBSOCKET SERVER
  # ----------------------------------------
  websocket:
    image: ${REGISTRY_IMAGE_PREFIX:-}areena-websocket:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/websocket-server/Dockerfile
    restart: unless-stopped
    environment:
      - WS_PORT=${WS_PORT:-5000}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      - redis

  # ----------------------------------------
  # 5. FRONTEND (Next.js App Router)
  # ----------------------------------------
  frontend:
    image: ${REGISTRY_IMAGE_PREFIX:-}areena-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_IS_DEMO: ${IS_DEMO:-false}
        NEXT_PUBLIC_APP_BASE_URL: ${APP_BASE_URL}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - BACKEND_INTERNAL_URL=http://backend:4000
      - DOMAIN_NAME=${DOMAIN_NAME}
      - NEXT_PUBLIC_IS_DEMO=${IS_DEMO:-false}
      - NEXT_PUBLIC_APP_BASE_URL=${APP_BASE_URL}
      - FRONTEND_PORT=${FRONTEND_PORT:-3000}
    depends_on:
      - backend
      - websocket

  # ----------------------------------------
  # 6. CENTRAL LOG SHIPPER (Vector - ~15MB RAM)
  # ----------------------------------------
  vector:
    image: timberio/vector:0.38.0-alpine
    restart: unless-stopped
    entrypoint: ["sh", "-c", "if [ -z \"$$LOGGING_URL\" ]; then echo 'LOGGING_URL is not set. Log shipping inactive.'; sleep infinity; else exec /usr/local/bin/vector --config /etc/vector/vector.toml; fi"]
    environment:
      - LOGGING_URL=${LOGGING_URL}
      - LOGGING_USER=${LOGGING_USER}
      - LOGGING_PASSWORD=${LOGGING_PASSWORD}
      - SERVER_NAME=${SERVER_NAME:-${DOMAIN_NAME:-areena-server}}
      - NODE_ENV=production
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./vector.toml:/etc/vector/vector.toml:ro

volumes:
  caddy_data:
  caddy_config:
